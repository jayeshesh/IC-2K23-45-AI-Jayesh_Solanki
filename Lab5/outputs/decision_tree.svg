<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Campus placement decision tree</title><desc id="desc">A compact representation of the trained depth-four tree from the development smoke test.</desc>
<rect width="1000" height="520" fill="white"/><text x="500" y="34" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#222">Campus Placement Decision Tree</text>
<g stroke="#555" stroke-width="2" fill="none"><path d="M500 110 L250 205 M500 110 L750 205 M750 255 L625 350 M750 255 L875 350 M625 400 L525 465 M625 400 L725 465"/></g>
<g font-family="Arial" text-anchor="middle"><rect x="365" y="60" width="270" height="55" rx="9" fill="#dbeafe" stroke="#345"/><text x="500" y="93" font-size="17" fill="#222">hsc_p ≤ 56.50?</text>
<rect x="125" y="180" width="250" height="55" rx="9" fill="#dcfce7" stroke="#345"/><text x="250" y="213" font-size="17" fill="#222">Not Placed</text>
<rect x="625" y="180" width="250" height="75" rx="9" fill="#dbeafe" stroke="#345"/><text x="750" y="210" font-size="16" fill="#222">degree_p ≤ 64.37?</text><text x="750" y="232" font-size="12" fill="#444">when hsc_p is higher</text>
<rect x="500" y="325" width="250" height="75" rx="9" fill="#dbeafe" stroke="#345"/><text x="625" y="355" font-size="15" fill="#222">ssc_b_Central ≤ 0.50?</text><text x="625" y="378" font-size="12" fill="#444">when degree_p is lower</text>
<rect x="800" y="325" width="150" height="55" rx="9" fill="#dcfce7" stroke="#345"/><text x="875" y="358" font-size="16" fill="#222">Placed</text>
<rect x="405" y="440" width="160" height="55" rx="9" fill="#dcfce7" stroke="#345"/><text x="485" y="473" font-size="16" fill="#222">Placed</text>
<rect x="645" y="440" width="160" height="55" rx="9" fill="#fee2e2" stroke="#345"/><text x="725" y="473" font-size="16" fill="#222">Not Placed</text></g>
<g font-family="Arial" font-size="13" fill="#555"><text x="290" y="150">Yes</text><text x="700" y="150">No</text><text x="545" y="300">Yes</text><text x="835" y="300">No</text><text x="430" y="425">Yes</text><text x="750" y="425">No</text></g>
<text x="500" y="512" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Structure from the 40-row smoke-test subset; full dataset will produce its own tree.</text></svg>